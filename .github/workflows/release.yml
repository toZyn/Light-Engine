name: Release

on:
  push:
    branches: [main]
    paths:
      - 'project.lua'
      - 'main.lua'
      - 'conf.lua'
      - 'funkin/**'
      - 'loxel/**'
      - 'lib/**'
      - 'assets/**'
      - 'art/**'
      - 'android/**'
      - 'tools/**'
      - 'tests/engine/**'
      - 'tests/desktop-packaging.py'
      - 'tests/android-manifest.py'
      - 'tests/fixtures/**'
      - 'examples/**'
      - 'separate-addons/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  LOVE_VERSION: '11.5'

jobs:
  engine-checks:
    name: Native engine checks
    uses: ./.github/workflows/engine-checks.yml
    permissions:
      contents: read

  prepare:
    name: Prepare release
    needs: engine-checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version from project.lua
        id: meta
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import re

          source = Path("project.lua").read_text()
          found = re.search(r'^\s*version\s*=\s*"([^"\n]+)"', source, re.MULTILINE)
          if not found:
              raise SystemExit("::error::No version found in project.lua")
          version = found.group(1)
          semver = re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
              r"(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", version)
          if not semver:
              raise SystemExit("::error::project.lua version must be a safe semantic version")
          override = re.search(r"^\s*androidVersionCode\s*=\s*([^,\n]+)", source, re.MULTILINE)
          if override:
              raw_code = override.group(1).split("--", 1)[0].strip()
              if not re.fullmatch(r"[0-9]+", raw_code):
                  raise SystemExit("::error::androidVersionCode must be a positive integer")
              code = int(raw_code)
          else:
              major, minor, patch = map(int, semver.group(1, 2, 3))
              if minor > 99 or patch > 99:
                  raise SystemExit("::error::Set androidVersionCode explicitly when minor or patch exceeds 99")
              code = major * 10000 + minor * 100 + patch
          if not 1 <= code <= 2100000000:
              raise SystemExit("::error::Android version code must be between 1 and 2100000000")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\n")
              output.write(f"release_name=Light Engine {version}\nandroid_version_code={code}\n")
          print(f"Release {version}; Android versionCode {code}")
          PYCODE

      - name: Build release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PATTERN="^## \[$(printf '%s' "$VERSION" | sed 's/\./\\./g')\]"
          awk -v pat="$PATTERN" '
            $0 ~ pat { found = 1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > changelog-section.md

          {
            echo "## Light Engine ${VERSION}"
            echo
            if [ -s changelog-section.md ]; then
              cat changelog-section.md
            else
              echo "See [CHANGELOG.md](CHANGELOG.md) and the commit history."
            fi
            echo
            echo "## Install"
            echo
            echo "- **Windows**: unzip and run \`Light Engine.exe\`."
            echo "- **Linux AppImage**: \`chmod +x\`, then run it."
            echo "- **Linux portable**: unpack the tar.gz and run \`light-engine.sh\`."
            echo "- **Android**: install the APK matching your CPU (\`arm64-v8a\`, \`armeabi-v7a\`) or the universal one."
          } > notes.md
          cat notes.md

      - name: Generate icons from art/logo.png
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            IM=convert
          fi
          mkdir -p inputs
          "$IM" art/logo.png -background none -resize 256x256 \
            -define icon:auto-resize=256,128,64,48,32,24,16 inputs/icon.ico
          "$IM" art/logo.png -resize 256x256 inputs/icon-256.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${spec%%:*}
            size=${spec##*:}
            mkdir -p "inputs/drawable-${dir}"
            "$IM" art/logo.png -resize "${size}x${size}" "inputs/drawable-${dir}/icon.png"
          done
          cp notes.md inputs/notes.md
          find inputs -type f | sort

      - name: Package the optional addon separately
        run: python3 tools/make_addon_release.py Light-Engine-screen-overlay-addon.zip

      - name: Open draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" --notes-file notes.md
          fi
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" CHANGELOG.md --clobber
          gh release upload "$TAG" Light-Engine-screen-overlay-addon.zip --clobber

      - name: Upload build inputs
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs
          path: inputs/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows ${{ matrix.arch }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            love_asset: love-11.5-win64.zip
          - arch: x86
            love_asset: love-11.5-win32.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build inputs
        uses: actions/download-artifact@v4
        with:
          name: build-inputs
          path: inputs

      - name: Build game.love
        shell: bash
        run: python tools/make_game_love.py game.love

      - name: Download LÖVE ${{ env.LOVE_VERSION }} for Windows
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --fail -o love.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/${{ matrix.love_asset }}"
          mkdir -p runtime
          unzip -q love.zip -d runtime

      - name: Fuse the game into the executable
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT="Light-Engine-${VERSION}-windows-${{ matrix.arch }}.zip"
          export OUT
          DIST="dist/Light Engine"

          LOVE_EXE=$(find runtime -maxdepth 2 -iname love.exe -print -quit)
          if [ -z "$LOVE_EXE" ]; then
            echo "::error::love.exe not found in the LÖVE archive"
            exit 1
          fi
          LOVE_DIR=$(dirname "$LOVE_EXE")

          rm -rf dist
          mkdir -p "$DIST"
          find "$LOVE_DIR" -maxdepth 1 -type f ! -iname 'love.exe' \
            -exec cp {} "$DIST/" \;
          cp "$LOVE_EXE" "$DIST/Light Engine.exe"

          # The app icon must be art/logo.png, not art/icon.png.
          curl -sSL --fail -o rcedit.exe \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          ./rcedit.exe "$DIST/Light Engine.exe" --set-icon "$PWD/inputs/icon.ico" \
            --set-version-string "ProductName" "Light Engine" \
            --set-version-string "FileDescription" "Light Engine" \
            --set-version-string "CompanyName" "Zyn" \
            --set-version-string "OriginalFilename" "Light Engine.exe"

          # LÖVE reads the .love appended to its own executable.
          LOVE_EXE_SIZE=$(stat -c%s "$DIST/Light Engine.exe")
          cat "$DIST/Light Engine.exe" game.love > "$DIST/fused.exe"
          mv "$DIST/fused.exe" "$DIST/Light Engine.exe"
          echo "LOVE_EXE_SIZE=$LOVE_EXE_SIZE" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

          python - <<'PY'
          import os
          import zipfile

          out = os.environ["OUT"]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for root, _, files in os.walk("dist"):
                  for name in sorted(files):
                      path = os.path.join(root, name)
                      archive.write(path, os.path.relpath(path, "dist").replace(os.sep, "/"))
          print(f"{out}: {os.path.getsize(out) / (1024 * 1024):.1f} MiB")
          PY

      - name: Validate the archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import zipfile

          out = os.environ["OUT"]
          exe = "Light Engine/Light Engine.exe"
          expected = int(os.environ["LOVE_EXE_SIZE"]) + os.path.getsize("game.love")

          with zipfile.ZipFile(out) as archive:
              names = archive.namelist()
              broken = [n for n in names if "\\" in n]
              if broken:
                  print(f"::error::{len(broken)} entries use backslashes, e.g. {broken[0]}")
                  sys.exit(1)
              try:
                  info = archive.getinfo(exe)
              except KeyError:
                  print(f"::error::{exe} missing from the archive: {names}")
                  sys.exit(1)
              if info.file_size != expected:
                  print(
                      f"::error::{exe} is {info.file_size} bytes, "
                      f"expected love.exe + game.love = {expected}"
                  )
                  sys.exit(1)
              with archive.open(info) as handle:
                  if handle.read(2) != b"MZ":
                      print("::error::the executable is not a PE file")
                      sys.exit(1)
          print(f"{out} looks valid ({len(names)} entries, {expected / (1024 * 1024):.1f} MiB)")
          PY

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$OUT" --clobber
          sha256sum "$OUT" > "sha256-windows-${{ matrix.arch }}.txt"

      - name: Store checksum
        uses: actions/upload-artifact@v4
        with:
          name: sha256-windows-${{ matrix.arch }}
          path: sha256-windows-${{ matrix.arch }}.txt
          retention-days: 1

  build-linux:
    name: Linux ${{ matrix.kind }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: AppImage
            suffix: x86_64.AppImage
          - kind: portable
            suffix: linux-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build inputs
        uses: actions/download-artifact@v4
        with:
          name: build-inputs
          path: inputs

      - name: Build game.love
        run: python3 tools/make_game_love.py game.love

      - name: Download the LÖVE AppImage runtime
        run: |
          set -euo pipefail
          curl -sSL --fail -o love.AppImage \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          chmod +x love.AppImage
          rm -rf AppDir squashfs-root
          ./love.AppImage --appimage-extract >/dev/null
          mv squashfs-root AppDir

      - name: Build the AppDir
        run: |
          set -euo pipefail
          cp game.love AppDir/game.love

          # The official AppRun already supports a fused game via FUSE_PATH.
          # shellcheck disable=SC2016  # $APPDIR must survive into the file
          sed -i 's|^#FUSE_PATH=.*|FUSE_PATH="$APPDIR/game.love"|' AppDir/AppRun
          # shellcheck disable=SC2016
          if ! grep -q 'FUSE_PATH="$APPDIR/game.love"' AppDir/AppRun; then
            echo "::error::could not point AppRun at game.love"
            exit 1
          fi

          rm -f AppDir/love.desktop AppDir/love.svg AppDir/.DirIcon
          cat > AppDir/LightEngine.desktop <<'EOF'
          [Desktop Entry]
          Name=Light Engine
          Comment=Friday Night Funkin' Light Engine
          Exec=love %f
          Icon=light-engine
          Terminal=false
          Type=Application
          Categories=Game;ArcadeGame;
          EOF
          install -m 0644 inputs/icon-256.png AppDir/light-engine.png
          ln -s light-engine.png AppDir/.DirIcon

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ "${{ matrix.suffix }}" = "x86_64.AppImage" ]; then
            curl -sSL --fail -o appimagetool \
              https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
              ./appimagetool AppDir "Light-Engine-${VERSION}-${{ matrix.suffix }}"
            OUT="Light-Engine-${VERSION}-${{ matrix.suffix }}"
          else
            D="Light-Engine-${VERSION}-linux-x86_64"
            mv AppDir "$D"
            install -m 0755 "$D/AppRun" "$D/light-engine.sh"
            tar -czf "Light-Engine-${VERSION}-${{ matrix.suffix }}" "$D"
            OUT="Light-Engine-${VERSION}-${{ matrix.suffix }}"
          fi
          export OUT
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: Validate the package
        run: |
          set -euo pipefail
          if [ "${OUT##*.}" = "AppImage" ]; then
            python - <<'PY'
          import os
          import sys

          out = os.environ["OUT"]
          with open(out, "rb") as handle:
              head = handle.read(12)
          if head[:4] != b"\x7fELF" or head[8:11] != b"AI\x02":
              print("::error::not a type 2 AppImage")
              sys.exit(1)
          # The bare LÖVE runtime is ~5 MB; anything close to it means the
          # game never made it into the image.
          minimum = max(5 * 1024 * 1024, os.path.getsize("game.love") // 2)
          if os.path.getsize(out) < minimum:
              print(
                  f"::error::{out} is {os.path.getsize(out)} bytes, "
                  f"expected at least {minimum}"
              )
              sys.exit(1)
          print(f"{out} looks valid")
          PY
          else
            D="${OUT%.tar.gz}"
            tar -tzf "$OUT" > listing.txt
            for entry in game.love bin/love light-engine.png LightEngine.desktop light-engine.sh; do
              if ! grep -qxF "$D/$entry" listing.txt; then
                echo "::error::$D/$entry is missing from the tarball"
                exit 1
              fi
            done
            echo "$OUT looks valid"
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$OUT" --clobber
          sha256sum "$OUT" > "sha256-linux-${{ matrix.suffix }}.txt"

      - name: Store checksum
        uses: actions/upload-artifact@v4
        with:
          name: sha256-linux-${{ matrix.suffix }}
          path: sha256-linux-${{ matrix.suffix }}.txt
          retention-days: 1

  build-android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build inputs
        uses: actions/download-artifact@v4
        with:
          name: build-inputs
          path: inputs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK
        id: sdk
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
          fi
          SDKM=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKM="$candidate"
              break
            fi
          done
          if [ -z "$SDKM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL --fail -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "sdkmanager=$SDKM" >> "$GITHUB_OUTPUT"
          echo "ndk=$SDK/ndk/25.2.9519653" >> "$GITHUB_OUTPUT"

      - name: Cache the NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.ndk }}
          key: android-ndk-25.2.9519653

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle.properties.example', 'android/AndroidManifest.xml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null 2>&1 || true
          if [ ! -d "${{ steps.sdk.outputs.ndk }}" ]; then
            "${{ steps.sdk.outputs.sdkmanager }}" --install "ndk;25.2.9519653"
          fi
          "${{ steps.sdk.outputs.sdkmanager }}" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Build game.love
        run: python3 tools/make_game_love.py game.love

      - name: Clone love-android
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 11.5a --recurse-submodules --shallow-submodules \
            https://github.com/love2d/love-android.git

      - name: Apply the project template
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          WS="$GITHUB_WORKSPACE"
          cd "$WS/love-android"

          # git resolves patch paths against the directory given to -C, so it
          # has to be absolute; the shell-relative one is wrong there.
          PATCH="$WS/android/allow-android-media-mount.patch"
          if git -C love/src/jni/love apply --check "$PATCH"; then
            git -C love/src/jni/love apply "$PATCH"
          elif git -C love/src/jni/love apply --reverse --check "$PATCH"; then
            echo "media mount patch is already applied"
          else
            echo "::error::allow-android-media-mount.patch does not apply to love 11.5"
            exit 1
          fi

          install -m 0644 ../android/StoragePermissionActivity.java \
            love/src/main/java/org/love2d/android/StoragePermissionActivity.java
          install -m 0644 ../android/AndroidManifest.xml app/src/main/AndroidManifest.xml
          install -m 0644 ../android/gradle.properties.example gradle.properties

          # Official direct-AAsset layout: resources remain in the APK and
          # GameActivity cannot copy a nested game.love into private cache.
          rm -f app/src/embed/assets/.gitkeep
          python3 "$WS/tools/make_android_assets.py" "$WS/game.love" app/src/embed/assets
          test -f app/src/embed/assets/main.lua
          test ! -f app/src/embed/assets/game.love

          # Validated during prepare; prerelease names never fall back to 1.
          CODE="${{ needs.prepare.outputs.android_version_code }}"
          sed -i "s/^app.version_code=.*/app.version_code=$CODE/" gradle.properties
          sed -i "s/^app.version_name=.*/app.version_name=$VERSION/" gradle.properties

          # Launcher icons come from art/logo.png, not art/icon.png.
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/drawable-$dir"
            install -m 0644 "../inputs/drawable-$dir/icon.png" "app/src/main/res/drawable-$dir/icon.png"
          done

          cat >> app/build.gradle <<'EOF'

          // Injected by .github/workflows/release.yml: one APK per ABI plus a universal one.
          android {
              // Already-compressed media must support direct AAsset seeking.
              aaptOptions {
                  noCompress 'png', 'jpg', 'jpeg', 'ogg', 'mp3', 'ogv', 'mp4', 'webm'
              }
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a'
                      universalApk true
                  }
              }
          }
          EOF

      - name: Build the APKs
        run: |
          set -euo pipefail
          cd love-android
          chmod +x gradlew
          ./gradlew :app:assembleEmbedNoRecordRelease --no-daemon

      - name: Sign the APKs
        run: |
          set -euo pipefail
          set -a
          . android/keystore.properties
          set +a
          rm -rf signed
          mkdir -p signed
          for apk in love-android/app/build/outputs/apk/embedNoRecord/release/*.apk; do
            name=$(basename "$apk" .apk)
            apksigner sign \
              --ks android/keystore.jks \
              --ks-type JKS \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEY_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "signed/$name.apk" "$apk"
            CERTS=$(apksigner verify --print-certs "signed/$name.apk")
            printf '%s\n' "$CERTS" | sed -n '1,4p'
          done
          ls -l signed

      - name: Validate and name the APKs
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          for apk in signed/*.apk; do
            echo "== $apk"
            aapt2 dump badging "$apk" \
              | grep -E "^(package|application-label|native-code):" || true
          done
          python3 - "$VERSION" <<'PY'
          import glob
          import os
          import sys
          import zipfile

          version = sys.argv[1]
          produced = {}
          for path in sorted(glob.glob("signed/*.apk")):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
              abis = sorted({
                  n.split("/")[1]
                  for n in names
                  if n.startswith("lib/") and n.count("/") > 1
              })
              if not abis:
                  print(f"::error::{path} has no native libraries")
                  sys.exit(1)
              if not {"assets/main.lua", "assets/conf.lua", "assets/project.lua"}.issubset(names) or "assets/game.love" in names:
                  print(f"::error::{path} does not use the direct APK asset layout")
                  sys.exit(1)
              if not any(n.startswith("META-INF/") for n in names):
                  print(f"::error::{path} is not signed")
                  sys.exit(1)
              if abis == ["arm64-v8a", "armeabi-v7a"]:
                  out = f"Light-Engine-{version}-android.apk"
              elif len(abis) == 1:
                  out = f"Light-Engine-{version}-android-{abis[0]}.apk"
              else:
                  print(f"::error::{path} has unexpected ABIs: {abis}")
                  sys.exit(1)
              os.replace(path, out)
              produced[out] = abis
              print(f"{out}: {', '.join(abis)}")

          if f"Light-Engine-{version}-android.apk" not in produced:
              print("::error::the universal APK is missing")
              sys.exit(1)
          PY
          ls -l Light-Engine-*.apk

      - name: Build the separate image-overlay companion
        run: |
          python3 tools/build_screen_overlay.py \
            --jdk "$JAVA_HOME" \
            --android-jar "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_SDK_ROOT/build-tools/35.0.0" \
            --output Light-Engine-screen-overlay-android.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(Light-Engine-*.apk)
          gh release upload "$TAG" "${APKS[@]}" --clobber
          sha256sum "${APKS[@]}" > sha256-android.txt

      - name: Store checksum
        uses: actions/upload-artifact@v4
        with:
          name: sha256-android
          path: sha256-android.txt
          retention-days: 1

  finalize:
    name: Publish release
    needs: [prepare, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build inputs
        uses: actions/download-artifact@v4
        with:
          name: build-inputs
          path: inputs

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
        run: |
          set -euo pipefail
          cat sha256-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$REPO"

          REQUIRED=(
            "Light-Engine-${VERSION}-windows-x64.zip"
            "Light-Engine-${VERSION}-windows-x86.zip"
            "Light-Engine-${VERSION}-x86_64.AppImage"
            "Light-Engine-${VERSION}-linux-x86_64.tar.gz"
            "Light-Engine-${VERSION}-android.apk"
            "Light-Engine-${VERSION}-android-arm64-v8a.apk"
            "Light-Engine-${VERSION}-android-armeabi-v7a.apk"
            "CHANGELOG.md"
            "SHA256SUMS.txt"
          )
          ATTACHED=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          MISSING=0
          for name in "${REQUIRED[@]}"; do
            if ! grep -qx "$name" <<< "$ATTACHED"; then
              echo "::error::$name is not attached, keeping the release as a draft"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          gh release edit "$TAG" --repo "$REPO" --draft=false --title "$RELEASE_NAME" --notes-file inputs/notes.md
          echo "Published $TAG"
          printf '%s\n' "$ATTACHED" | sort
