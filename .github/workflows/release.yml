name: Release Build

on:
  push:
    branches: [main]
    paths:
      - 'project.lua'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional, reads from project.lua)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  LOVE_VERSION: 11.5
  PROJECT_NAME: "Light Engine"

jobs:
  # Job to extract version and generate changelog
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag: ${{ steps.extract_version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      release_name: ${{ steps.extract_version.outputs.release_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from project.lua
        id: extract_version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' project.lua)
          TAG="v${VERSION}"
          RELEASE_NAME="Light Engine ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Generate changelog from git log
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null | head -30)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release of Light Engine ${VERSION}"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Create release body
        id: release_body
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          RELEASE_NAME="${{ steps.extract_version.outputs.release_name }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          COMMIT="${{ github.sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "# 🎮 ${RELEASE_NAME}"
            echo ""
            echo "## 📥 Descargas"
            echo ""
            echo "| Plataforma | Archivo |"
            echo "|------------|---------|"
            echo "| **Android** | \`Light-Engine-${VERSION}-android.apk\` |"
            echo "| **Windows (64-bit)** | \`Light-Engine-${VERSION}-windows-x64.zip\` |"
            echo "| **Linux (64-bit)** | \`Light-Engine-${VERSION}-linux-x64.zip\` |"
            echo ""
            echo "## 📋 Novedades"
            echo ""
            echo "${CHANGELOG}"
            echo ""
            echo "---"
            echo ""
            echo "## ⚙️ Información de la compilación"
            echo ""
            echo "- **Versión**: ${VERSION}"
            echo "- **Motor**: LÖVE 11.5"
            echo "- **Paquete**: com.zyn.lightengine"
            echo "- **Fecha**: ${DATE}"
            echo "- **Commit**: ${COMMIT}"
            echo ""
            echo "## 🛠️ Requisitos"
            echo ""
            echo "### Android"
            echo "- Android 7.0 (API 24) o superior"
            echo "- Arquitectura: arm64-v8a, armeabi-v7a, x86, x86_64"
            echo ""
            echo "### Windows"
            echo "- Windows 10/11 (64-bit)"
            echo "- Visual C++ Redistributable 2019+"
            echo ""
            echo "### Linux"
            echo "- glibc 2.31+"
            echo "- libGL, libopenal, libSDL2"
            echo ""
            echo "## 🎨 Capturas de pantalla"
            echo ""
            echo "![Light Engine Logo](assets/images/menus/splashscreen/FNFLOVE_logo.png)"
            echo ""
            echo "---"
            echo ""
            echo "**Desarrollado por [Zyn](https://github.com/toZyn) | Basado en [FNF Love](https://github.com/FNF-Love)**"
          } > release_body.md
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # Android Build
  build-android:
    name: Build Android
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.version != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # Accept licenses and install required packages
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clone love-android
        run: |
          git clone --depth 1 --branch 11.5a --recurse-submodules https://github.com/love2d/love-android.git
          echo "LOVE_ANDROID_DIR=$(pwd)/love-android" >> $GITHUB_ENV

      - name: Apply patches and copy files
        run: |
          cd love-android
          # Apply PhysFS patch for Android/media access
          if git -C love/src/jni/love apply --reverse --check ../android/allow-android-media-mount.patch >/dev/null 2>&1; then
            echo "Patch already applied"
          elif git -C love/src/jni/love apply --check ../android/allow-android-media-mount.patch >/dev/null 2>&1; then
            git -C love/src/jni/love apply ../android/allow-android-media-mount.patch
          fi

          # Copy launcher and manifest
          cp ../android/StoragePermissionActivity.java love/src/main/java/org/love2d/android/StoragePermissionActivity.java
          cp ../android/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp ../android/gradle.properties.example gradle.properties

      - name: Create .love file
        run: |
          # Create game.love (zip of source)
          zip -r game.love . -x ".git/*" ".github/*" "android/*" "tools/*" "lib/*" "release/*" "*.love" "*.apk" "*.zip" "*.md" "*.txt" "*.xml" "*.json" "*.lua" "*.yml" "*.yaml" "Cargo*" "actionlint*" "job_logs*"
          echo "LOVE_FILE=$(pwd)/game.love" >> $GITHUB_ENV

      - name: Embed .love into APK
        run: |
          cd love-android
          cp "$LOVE_FILE" app/src/embed/assets/game.love

      - name: Build APK
        run: |
          cd love-android
          chmod +x gradlew
          ./gradlew :app:assembleEmbedNoRecordRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: love-android/app/build/outputs/apk/embedNoRecord/release/app-embed-noRecord-release-unsigned.apk
          retention-days: 30

  # Windows Build
  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    if: needs.prepare.outputs.version != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LÖVE ${{ env.LOVE_VERSION }} for Windows
        run: |
          $LOVE_VERSION = "${{ env.LOVE_VERSION }}"
          $LOVE_URL = "https://github.com/love2d/love/releases/download/$LOVE_VERSION/love-$LOVE_VERSION-win64.zip"
          Invoke-WebRequest -Uri $LOVE_URL -OutFile "love-$LOVE_VERSION-win64.zip"
          Expand-Archive -Path "love-$LOVE_VERSION-win64.zip" -DestinationPath "love"
          $LOVE_DIR = (Get-ChildItem "love" -Directory | Where-Object { $_.Name -match "love-$LOVE_VERSION-win64" }).FullName
          echo "LOVE_DIR=$LOVE_DIR" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Create .love file and distribution
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $loveDir = $env:LOVE_DIR
          $distDir = "Light-Engine-$version-windows-x64"
          New-Item -ItemType Directory -Path $distDir -Force
          
          # Copy love.exe and dlls
          Copy-Item "$loveDir\*" $distDir -Recurse -Force
          
          # Create game.love (zip of source) - use Compress-Archive with exclude
          $exclude = @(
            ".git*",
            ".github",
            "android",
            "tools",
            "lib",
            "release",
            "love",
            "*.love",
            "*.apk",
            "*.zip",
            "*.md",
            "*.txt",
            "*.xml",
            "*.json",
            "*.lua",
            "*.yml",
            "*.yaml",
            "Cargo*",
            "actionlint*",
            "job_logs*"
          )
          $files = Get-ChildItem -Recurse -File | Where-Object { 
            $relative = $_.FullName.Substring((Get-Location).Path.Length + 1)
            $shouldExclude = $false
            foreach ($pattern in $exclude) {
              if ($relative -like $pattern) { $shouldExclude = $true; break }
            }
            return -not $shouldExclude
          }
          $files | Compress-Archive -DestinationPath "$distDir\game.love" -Force
          
          # Create launch script
          "@echo off
          start love.exe game.love" | Out-File -Encoding ASCII "$distDir\Light Engine.bat"
          
          # Zip it
          Compress-Archive -Path "$distDir\*" -DestinationPath "Light-Engine-$version-windows-x64.zip" -Force
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Light-Engine-${{ needs.prepare.outputs.version }}-windows-x64.zip
          retention-days: 30

  # Linux Build
  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.version != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LÖVE 11.5 Linux tarball
        run: |
          LOVE_URL="https://github.com/love2d/love/releases/download/11.5/love-11.5-linux-x86_64.tar.gz"
          wget -q "$LOVE_URL" -O love.tar.gz
          tar -xzf love.tar.gz
          LOVE_DIR=$(find . -maxdepth 1 -type d -name 'love-11.5*' | head -1)
          echo "LOVE_DIR=$(pwd)/$LOVE_DIR" >> $GITHUB_PATH

      - name: Create .love file
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DIST_DIR="Light-Engine-$VERSION-linux-x64"
          mkdir -p "$DIST_DIR"
          
          # Create game.love (zip of source)
          zip -r game.love . -x ".git/*" ".github/*" "android/*" "tools/*" "lib/*" "release/*" "*.love" "*.apk" "*.zip" "*.md" "*.txt" "*.xml" "*.json" "*.lua" "*.yml" "*.yaml" "Cargo*" "actionlint*" "job_logs*"
          
          # Copy love runtime
          cp -r "$LOVE_DIR"/* "$DIST_DIR/"
          
          # Copy game
          cp game.love "$DIST_DIR/game.love"
          
          # Create launch script
          {
            echo '#!/bin/bash'
            echo 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            echo 'export LD_LIBRARY_PATH="$SCRIPT_DIR:$LD_LIBRARY_PATH"'
            echo 'exec "$SCRIPT_DIR/love" "$SCRIPT_DIR/game.love" "$@"'
          } > "$DIST_DIR/Light Engine"
          chmod +x "$DIST_DIR/Light Engine"
          
          # Create desktop entry
          {
            echo '[Desktop Entry]'
            echo 'Name=Light Engine'
            echo 'Comment=Friday Night Funkin\' Light Engine'
            echo 'Exec=Light Engine'
            echo 'Icon=light-engine'
            echo 'Type=Application'
            echo 'Categories=Game;ArcadeGame;'
          } > "$DIST_DIR/Light Engine.desktop"
          
          # Zip it
          cd "$DIST_DIR" && zip -r "../Light-Engine-$VERSION-linux-x64.zip" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: Light-Engine-${{ needs.prepare.outputs.version }}-linux-x64.zip
          retention-days: 30

  # Create Release
  release:
    name: Create Release
    needs: [prepare, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.version != ''
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: ./artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: ./artifacts/linux

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mv ./artifacts/android/*.apk "Light-Engine-$VERSION-android.apk"
          mv ./artifacts/windows/*.zip "Light-Engine-$VERSION-windows-x64.zip"
          mv ./artifacts/linux/*.zip "Light-Engine-$VERSION-linux-x64.zip"

      - name: Upload logo to release
        run: |
          cp assets/images/menus/splashscreen/FNFLOVE_logo.png light-engine-logo.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release_body.md
          files: |
            Light-Engine-${{ needs.prepare.outputs.version }}-android.apk
            Light-Engine-${{ needs.prepare.outputs.version }}-windows-x64.zip
            Light-Engine-${{ needs.prepare.outputs.version }}-linux-x64.zip
            light-engine-logo.png
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        run: |
          gh release view ${{ needs.prepare.outputs.tag }} --json assets --jq '.assets[].name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}