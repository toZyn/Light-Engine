name: Psych Lua shim

# Compiles Psych Engine's own Lua layer (source/psychlua/*.hx) to Lua, so the
# engine can run Psych's real functions instead of a hand-written port of them.
#
# The job downloads Haxe and a Psych 1.0.4 checkout itself, so its result says
# something about the shim and never about the game build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/psych-externs/**'
      - 'tools/build_psych_lua.py'
      - '.github/workflows/psych-lua.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/psych-externs/**'
      - 'tools/build_psych_lua.py'

permissions:
  contents: read

env:
  HAXE_VERSION: '4.3.7'
  PSYCH_REF: '1.0.4'

jobs:
  compile:
    name: Compile Psych 1.0.4 Lua layer to Lua
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Haxe
        run: |
          set -euo pipefail
          url="https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz"
          curl -fsSL "$url" -o /tmp/haxe.tar.gz
          mkdir -p "$HOME/haxe"
          tar -xzf /tmp/haxe.tar.gz -C "$HOME/haxe" --strip-components=1
          echo "$HOME/haxe" >> "$GITHUB_PATH"
          "$HOME/haxe/haxe" --version

      - name: Fetch Psych ${{ env.PSYCH_REF }} sources
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://codeload.github.com/ShadowMario/FNF-PsychEngine/tar.gz/refs/tags/${PSYCH_REF}" \
            -o /tmp/psych.tar.gz
          mkdir -p /tmp/psych
          tar -xzf /tmp/psych.tar.gz -C /tmp/psych --strip-components=1
          ls /tmp/psych/source/psychlua

      - name: Compile the shim
        # This compiles today, so a failure is a regression and the job goes red.
        # The log is still uploaded by the last step, so a break stays diagnosable.
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/build_psych_lua.py --source /tmp/psych --out build/psych-lua \
            2>&1 | tee build/psych-lua.log

      - name: Check the output carries Psych's callbacks
        # Not "a file exists" but "the file contains the functions". Every name
        # the sources register is looked up in the generated Lua, so a shim that
        # compiled while dropping callbacks still fails.
        if: hashFiles('build/psych-lua/psych-lua.lua') != ''
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import pathlib, subprocess, sys, textwrap

          shim = pathlib.Path('build/psych-lua/psych-lua.lua')
          harness = pathlib.Path('build/harness.lua')
          harness.write_text(textwrap.dedent(f"""
            package.path = './?.lua;' .. package.path
            local Bindings = require('funkin.backend.scripts.psych.bindings')
            local bridge = Bindings.installLuaApi(setmetatable({{}}, {{__index = _G}}))

            -- The shim, loaded the way the engine loads it. Checking it parses is
            -- what tells "compiled" apart from "runnable".
            local chunk = assert(loadfile('{shim}'))
            local scope = setmetatable({{}}, {{__index = _G}})
            scope._G = scope
            Bindings.installLuaApi(scope)
            if setfenv then setfenv(chunk, scope) end
            chunk()

            -- install(): the 94 callbacks in the helper classes. This works
            -- without a song, because those classes only need a FunkinLua object.
            local state = scope.LuaL.newstate()
            local host = {{lua = state, callbacks = {{}}, customFunctions = {{}}}}
            host.addLocalCallback = function(_, name, fn)
              scope.Lua_helper.add_callback(state, name, fn)
            end
            host.initLuaShader = function() return false end

            scope.lightPsychInstall(host)
            local helperCount = 0
            for _ in pairs(bridge.registryFor(state).callbacks) do
              helperCount = helperCount + 1
            end
            print('install registered ' .. helperCount .. ' callbacks')
            assert(helperCount >= 90,
                   'helper surface incomplete: ' .. helperCount)
            assert(bridge.registryFor(state).callbacks.setProperty,
                   'setProperty not registered by install')

            -- createScript() is the song-time path: FunkinLua.new() registers the
            -- other 128 and then runs the source. It cannot be exercised without
            -- a song, so what is checked here is that the entry point exists --
            -- the live path is covered by tests/engine/psych-bindings.lua.
            assert(type(scope.lightPsychCreateScript) == 'function',
                   'the shim never exposed lightPsychCreateScript')
            print('SHIM RAN OK')
          """))

          result = subprocess.run(['lua5.1', str(harness)], text=True,
                                  capture_output=True)
          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              lines = [l for l in result.stderr.splitlines() if l.strip()]
              for i in range(0, min(len(lines), 12), 4):
                  print("::error title=shim trace %d::" % i
                        + " / ".join(lines[i:i+4])[:1200])
              sys.exit(1)
          PYEOF

      - name: Report the remaining surface gap
        # Only reachable when the compile failed, and then the missing-symbol
        # list *is* the deliverable. Run logs are not readable from every client,
        # so it is emitted as annotations, one per category, to fit the cap.
        if: failure()
        run: |
          set -euo pipefail
          LOG=build/psych-lua.log
          [ -f "$LOG" ] || { echo "::warning::no compiler log was produced"; exit 0; }
          python3 - "$LOG" <<'PYEOF'
          import re, sys, collections
          lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()

          kinds = collections.defaultdict(set)
          for line in lines:
              for pat, label in (
                  (r"Unknown identifier : (\w+)", 'identifier'),
                  (r"Unknown type : (\w+)", 'type'),
                  (r"has no field (\w+)", 'field'),
                  (r"Module (\w+) does not define", 'module'),
              ):
                  m = re.search(pat, line)
                  if m:
                      kinds[label].add(m.group(1))
                      break

          errors = [l for l in lines if re.search(r"\.hx:\d+:", l)]
          print(f"RESULT {len(errors)} errors, "
                + ", ".join(f"{k}={len(v)}" for k, v in sorted(kinds.items())))

          for label in sorted(kinds):
              names = sorted(kinds[label])
              print(f"::error title={label} ({len(names)})::{', '.join(names)}")

          if errors:
              print(f"::error title=first errors::\n".join(errors[:25])[:6000])
          PYEOF

      - name: Run the shim against the bridge
        # Compiling proves Psych's source is expressible in Lua. This proves the
        # result actually runs: the generated file is loaded, its callbacks are
        # registered through the bridge, and one is invoked the way FunkinLua
        # does. A shim that compiles but cannot execute is not support.
        if: hashFiles('build/psych-lua/psych-lua.lua') != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          python3 - <<'PYEOF'
          import pathlib, subprocess, sys, textwrap

          shim = pathlib.Path('build/psych-lua/psych-lua.lua')
          harness = pathlib.Path('build/harness.lua')
          harness.write_text(textwrap.dedent(f"""
            package.path = './?.lua;' .. package.path
            local Bindings = require('funkin.backend.scripts.psych.bindings')
            -- The shim runs in its own environment, the way the engine runs it:
            -- globals it assigns stay in scope, everything else falls through to
            -- the real ones (setmetatable, pcall, string, ...).
            local scope = setmetatable({{}}, {{__index = _G}})
            scope._G = scope
            local bridge = Bindings.installLuaApi(scope)

            -- Psych's compiled layer, loaded the way the engine loads it.
            local chunk = assert(loadfile('{shim}'))
            setfenv(chunk, scope)
            chunk()

            assert(type(scope.lightPsychInstall) == 'function',
                   'the shim never exposed lightPsychInstall')

            local state = scope.LuaL.newstate()
            local host = {{lua = state, callbacks = {{}}, runtimeShaders = {{}}}}
            host.addLocalCallback = function(_, name, fn)
              scope.Lua_helper.add_callback(state, name, fn)
            end
            host.initLuaShader = function() return false end

            scope.lightPsychInstall(host)

            local callbacks = bridge.registryFor(state).callbacks
            local count = 0
            for _ in pairs(callbacks) do count = count + 1 end
            print('registered ' .. count .. ' callbacks from the shim')
            assert(count >= 200, 'expected the full Psych surface, got ' .. count)
            assert(callbacks.setProperty, 'setProperty not registered')
            assert(callbacks.makeLuaSprite, 'makeLuaSprite not registered')
            print('SHIM RAN OK')
          """))

          result = subprocess.run(['lua5.1', str(harness)], text=True,
                                  capture_output=True)
          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              # The whole traceback, split across annotations: the last line is
              # usually just "[C]: ?" and says nothing.
              lines = [l for l in result.stderr.splitlines() if l.strip()]
              for i in range(0, min(len(lines), 12), 4):
                  print("::error title=shim trace %d::" % i
                        + " / ".join(lines[i:i+4])[:1200])
              sys.exit(1)
          PYEOF

      - name: Upload shim and compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psych-lua-shim
          path: |
            build/psych-lua/psych-lua.lua
            build/psych-lua.log
          if-no-files-found: warn
          retention-days: 14
