<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Engine · Scene editor</title>
<style>body{font:16px system-ui;background:#161616;color:#eee;margin:40px auto;padding:0 24px;max-width:1050px}h1{font-size:28px}p{color:#bbb}button,input,textarea{font:inherit;color:inherit;background:#252525;border:1px solid #555;border-radius:5px;padding:9px}button{cursor:pointer}textarea{width:95%;min-height:105px;font-family:monospace}section{border-top:1px solid #555;padding:20px 0}label{display:inline-grid;gap:6px;margin:5px}label.wide{display:grid}output{display:block;padding:18px 0;white-space:pre-wrap}nav{display:flex;gap:10px;flex-wrap:wrap}.error{color:#ff9e9e}</style>
<h1>Scene editor</h1><p>Times use seconds. Prepare assets before a scene starts; track scene-owned objects with <code>Mod.sceneTrack</code> so the engine can retire them safely.</p>
<nav><button id="open">Open manifest</button><button id="add">Add scene</button><button id="save">Validate & export</button><input id="file" type="file" accept=".json" hidden></nav>
<label class="wide">Shader names · one per line<textarea id="shaders" placeholder="stage-glow"></textarea></label><main id="scenes"></main><output id="status" aria-live="polite"></output>
<script>
let data={shaders:[],scenes:[]};const $=id=>document.getElementById(id);
function message(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function render(){ $('shaders').value=(data.shaders||[]).join('\n');$('scenes').replaceChildren();data.scenes.forEach((scene,index)=>{
 const box=document.createElement('section');const title=document.createElement('h2');title.textContent='Scene '+(index+1);box.append(title);
 for(const [key,label] of [['name','Name'],['start','Start'],['finish','Finish · optional'],['lead','Preload lead · default 3']]){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.value=scene[key]??'';input.type=key==='name'?'text':'number';if(key!=='name'){input.min=0;input.step='any';}input.oninput=()=>{if(input.value==='')delete scene[key];else scene[key]=key==='name'?input.value:Number(input.value);};l.append(input);box.append(l);}
 for(const key of ['assets','characters']){const l=document.createElement('label');l.className='wide';l.textContent=key+' · JSON array';const input=document.createElement('textarea');input.value=JSON.stringify(scene[key]||[],null,2);input.oninput=()=>{try{scene[key]=JSON.parse(input.value);input.setCustomValidity('');}catch(e){input.setCustomValidity(e.message);}};l.append(input);box.append(l);}
 const remove=document.createElement('button');remove.textContent='Remove scene';remove.onclick=()=>{data.scenes.splice(index,1);render();};box.append(remove);$('scenes').append(box);
 });}
function validate(){const names=new Set();for(const scene of data.scenes){if(typeof scene.name!=='string'||!scene.name||names.has(scene.name))throw Error('Each scene needs a unique name');names.add(scene.name);if(!Number.isFinite(scene.start)||scene.start<0)throw Error('Invalid start: '+scene.name);if(scene.finish!==undefined&&(!Number.isFinite(scene.finish)||scene.finish<=scene.start))throw Error('Finish must follow start: '+scene.name);if(scene.lead!==undefined&&(!Number.isFinite(scene.lead)||scene.lead<0))throw Error('Invalid lead: '+scene.name);if(!Array.isArray(scene.assets||[])||!Array.isArray(scene.characters||[]))throw Error('Assets and characters must be arrays');for(const asset of scene.assets||[])if(!Array.isArray(asset)||!['image','atlas','animate'].includes(asset[0])||typeof asset[1]!=='string'||!asset[1])throw Error('Invalid asset: '+scene.name);for(const name of scene.characters||[])if(typeof name!=='string'||!name)throw Error('Invalid character: '+scene.name);}}
$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const next=JSON.parse(await $('file').files[0].text());if(!next||!Array.isArray(next.scenes)||!Array.isArray(next.shaders||[]))throw Error('Expected scenes and shaders arrays');data=next;render();validate();message('Manifest opened');}catch(e){message(e.message,true);}};
$('add').onclick=()=>{data.scenes.push({name:'scene-'+(data.scenes.length+1),start:0,lead:3,assets:[],characters:[]});render();};
$('save').onclick=()=>{try{for(const input of document.querySelectorAll('textarea'))if(!input.reportValidity())throw Error('Correct invalid JSON before export');data.shaders=$('shaders').value.split('\n').map(s=>s.trim()).filter(Boolean);validate();const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='scenes.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('Validated manifest exported');}catch(e){message(e.message,true);}};render();
</script></html>
